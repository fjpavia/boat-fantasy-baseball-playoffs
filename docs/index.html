<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League 26714 — Playoffs</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #21262d;
    --ink: #e6edf3;
    --dim: #8b949e;
    --win: #3fb950;      /* category won */
    --winbg: rgba(63,185,80,0.10);
    --live: #d29922;     /* in-progress */
    --num: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--line);
    padding-bottom: 16px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .updated { color: var(--dim); font-size: 12px; font-family: var(--num); }

  /* bracket spine */
  .bracket { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    margin-bottom: 32px; }
  .col-label { color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; margin-bottom: 8px; }
  .slot { background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .slot .seed { color: var(--dim); font-family: var(--num); font-size: 11px;
    min-width: 16px; }
  .slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .slot.won { border-color: var(--win); }
  .slot.won .nm { color: var(--win); }
  .slot.bye { border-style: dashed; color: var(--dim); }
  .slot .pts { font-family: var(--num); color: var(--dim); font-size: 12px; }

  /* matchup scoreboards */
  .round-head { font-size: 13px; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 28px 0 12px; display: flex; gap: 10px;
    align-items: center; }
  .round-head .dates { font-family: var(--num); text-transform: none;
    letter-spacing: 0; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 999px;
    font-family: var(--num); letter-spacing: 0.04em; }
  .tag.live { background: rgba(210,153,34,0.15); color: var(--live); }
  .tag.final { background: var(--winbg); color: var(--win); }

  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .card .teams { display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 12px 14px; gap: 8px;
    border-bottom: 1px solid var(--line); }
  .card .team { font-size: 14px; font-weight: 550; min-width: 0; }
  .card .team.r { text-align: right; }
  .card .team .s { color: var(--dim); font-weight: 400; font-family: var(--num);
    font-size: 12px; margin: 0 4px; }
  .card .team.adv { color: var(--win); }
  .card .score { font-family: var(--num); font-size: 15px; color: var(--dim);
    white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-family: var(--num);
    font-size: 13px; }
  td, th { padding: 5px 14px; }
  th { color: var(--dim); font-weight: 400; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; text-align: center; }
  td.cat { color: var(--dim); text-align: center; width: 64px; }
  td.v { text-align: center; width: 42%; }
  td.v.w { color: var(--win); background: var(--winbg); }
  tr:not(:last-child) td { border-bottom: 1px solid var(--line); }

  .empty { color: var(--dim); text-align: center; padding: 48px 0;
    border: 1px dashed var(--line); border-radius: 10px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px; display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--dim); }
  @media (max-width: 560px) {
    .bracket { grid-template-columns: 1fr; }
    td, th { padding: 5px 8px; }
    .card .teams { padding: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Playoffs <span>· League 26714</span></h1>
    <div class="updated" id="updated"></div>
  </header>

  <div id="bracket" class="bracket"></div>
  <div id="rounds"></div>

  <footer>
    <span>Rate stats computed from game logs — may differ slightly from Yahoo's rounded values.</span>
    <a href="https://baseball.fantasysports.yahoo.com/">Fantasy data provided by Yahoo Fantasy</a>
  </footer>
</div>

<script>
const CATS = ["R","HR","RBI","SB","AVG","OPS","W","SV","K","HLD","ERA","WHIP"];
const FMT = { AVG: v=>v.toFixed(3), OPS: v=>v.toFixed(3),
              ERA: v=>v.toFixed(2), WHIP: v=>v.toFixed(2) };
const fmt = (c,v) => (FMT[c] ? FMT[c](v) : String(Math.round(v)));

fetch("data/bracket.json?" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(render)
  .catch(() => {
    document.getElementById("rounds").innerHTML =
      '<div class="empty">No bracket yet. Seed it and score round 1 to see results here.</div>';
  });

function render(b) {
  const seeds = b.seeds || {};
  const results = b.results || {};
  document.getElementById("updated").textContent =
    "updated " + new Date().toLocaleString([], {month:"short", day:"numeric",
      hour:"numeric", minute:"2-digit"});

  renderBracket(seeds, results);
  renderRounds(seeds, results);
}

function winnerOf(results, rnd, seed) {
  const r = results[String(rnd)];
  if (!r) return null;
  const m = r.matchups.find(m => m.a_seed === seed || m.b_seed === seed);
  return m ? m.winner : null;
}

function renderBracket(seeds, results) {
  const el = document.getElementById("bracket");
  const r1 = results["1"], r2 = results["2"], r3 = results["3"];

  const slot = (seed, opts={}) => {
    if (seed == null) return `<div class="slot bye"><span class="nm">TBD</span></div>`;
    const won = opts.won ? " won" : "";
    const bye = opts.bye ? " bye" : "";
    const pts = opts.pts != null ? `<span class="pts">${opts.pts}</span>` : "";
    const tag = opts.bye ? `<span class="pts">bye</span>` : pts;
    return `<div class="slot${won}${bye}"><span class="seed">${seed}</span>`
         + `<span class="nm">${seeds[String(seed)]||"?"}</span>${tag}</div>`;
  };

  // Round 1 column: 3v6, 4v5
  let c1 = `<div class="col-label">Round 1</div>`;
  const r1w = s => r1 ? winnerOf(results,1,s)===s : false;
  c1 += slot(3,{won:r1w(3)}) + slot(6,{won:r1w(6)});
  c1 += `<div style="height:8px"></div>`;
  c1 += slot(4,{won:r1w(4)}) + slot(5,{won:r1w(5)});

  // Round 2 column: seeds 1,2 enter here vs R1 winners
  let c2 = `<div class="col-label">Round 2</div>`;
  const r2w = s => r2 ? winnerOf(results,2,s)===s : false;
  if (r2) {
    for (const m of r2.matchups) {
      c2 += slot(m.a_seed,{won:m.winner===m.a_seed});
      c2 += slot(m.b_seed,{won:m.winner===m.b_seed});
      c2 += `<div style="height:8px"></div>`;
    }
  } else {
    c2 += slot(1,{bye:true}) + slot(2,{bye:true});
  }

  // Final
  let c3 = `<div class="col-label">Final</div>`;
  if (r3) {
    const m = r3.matchups[0];
    c3 += slot(m.a_seed,{won:m.winner===m.a_seed});
    c3 += slot(m.b_seed,{won:m.winner===m.b_seed});
    if (r3.final) {
      c3 += `<div class="slot won" style="margin-top:12px">`
          + `<span class="nm">🏆 ${seeds[String(m.winner)]}</span></div>`;
    }
  } else {
    c3 += slot(null) + slot(null);
  }

  el.innerHTML = `<div>${c1}</div><div>${c2}</div><div>${c3}</div>`;
}

function renderRounds(seeds, results) {
  const host = document.getElementById("rounds");
  const rounds = Object.keys(results).map(Number).sort((a,b)=>b-a); // newest first
  if (!rounds.length) {
    host.innerHTML = '<div class="empty">No results scored yet.</div>';
    return;
  }
  const names = {1:"Round 1", 2:"Round 2", 3:"Final"};
  host.innerHTML = rounds.map(rnd => {
    const r = results[String(rnd)];
    const tag = r.final ? `<span class="tag final">final</span>`
                        : `<span class="tag live">in progress</span>`;
    const head = `<div class="round-head">${names[rnd]||("Round "+rnd)}`
               + `<span class="dates">${r.start} – ${r.end}</span>${tag}</div>`;
    return head + r.matchups.map(m => matchupCard(m, seeds)).join("");
  }).join("");
}

function matchupCard(m, seeds) {
  const aAdv = m.winner === m.a_seed;
  const rows = CATS.map(c => {
    const cell = m.categories[c];
    const aw = cell.result === "A" || cell.result === "TIE";
    const bw = cell.result === "B" || cell.result === "TIE";
    return `<tr><td class="v${aw?" w":""}">${fmt(c,cell.a)}</td>`
         + `<td class="cat">${c}</td>`
         + `<td class="v${bw?" w":""}">${fmt(c,cell.b)}</td></tr>`;
  }).join("");

  const tie = m.a_points === m.b_points;
  return `<div class="card">
    <div class="teams">
      <div class="team${aAdv?" adv":""}"><span class="s">${m.a_seed}</span>${seeds[String(m.a_seed)]}</div>
      <div class="score">${m.a_points} – ${m.b_points}</div>
      <div class="team r${!aAdv?" adv":""}">${seeds[String(m.b_seed)]}<span class="s">${m.b_seed}</span></div>
    </div>
    <table><tbody>${rows}</tbody></table>
    ${tie ? `<div style="padding:8px 14px;color:var(--dim);font-size:12px;font-family:var(--num)">6–6 — higher seed (${m.winner}) advances</div>`:""}
  </div>`;
}
</script>
</body>
</html>
